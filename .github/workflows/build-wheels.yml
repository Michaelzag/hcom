name: Build Wheels

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  # HAND-MAINTAINED: dispatch lets a branch get a pre-merge compile check of
  # every wheel target (notably darwin + android, which no PR job builds):
  #   gh workflow run build-wheels.yml --ref <branch>
  # Dispatch only uploads artifacts; it never publishes (PyPI publish is a
  # separate workflow_call inside the Release chain). The `plan` input is
  # vestigial here — no job in this file reads it.
  workflow_dispatch:
    inputs:
      plan:
        description: "unused by dispatch; workflow_call plumbing only"
        required: false
        default: ""
        type: string

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: manylinux_2_28
            docker-options: -e CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: auto
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          docker-options: ${{ matrix.docker-options || '' }}

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: temurin

      # Pinned default packages are `tools platform-tools`, but Google
      # removed the obsolete `tools` package, so `sdkmanager tools` exits 1
      # and fails the step. The NDK install below is explicit; platform-tools
      # is all this job needs from the setup action.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install NDK r27d
        run: yes | sdkmanager "ndk;27.3.13750724" > /dev/null

      - name: Build wheel
        run: |
          rustup target add aarch64-linux-android
          pip install maturin==1.14.1

          NDK_BIN="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"

          maturin build --release --target aarch64-linux-android --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-aarch64-linux-android
          path: dist/*.whl
